<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild West Frontier 3D</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="game-container"></div>

    <div id="hud">
        <div id="speed-meter">Speed: 0 km/h</div>
        <div id="vehicle-type">On Foot</div>
        <div id="position">X: 0 Z: 0</div>
        <div id="instructions">
            <p><strong>WASD / Arrows</strong> Move</p>
            <p><strong>Mouse</strong> Look</p>
            <p><strong>Space</strong> Jump</p>
            <p><strong>E</strong> Mount / Dismount</p>
            <p><strong>V</strong> Change Vehicle</p>
            <p><strong>Shift</strong> Sprint</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
