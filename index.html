<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild West 3D - Open World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container"></div>
    <div id="hud">
        <div id="speed-meter">Speed: 0 km/h</div>
        <div id="vehicle-type">On Foot</div>
        <div id="position">X: 0 Z: 0</div>
        <div id="instructions">
            <p><strong>WASD/Arrow Keys</strong> - Move</p>
            <p><strong>SPACE</strong> - Jump</p>
            <p><strong>E</strong> - Mount/Dismount Horse</p>
            <p><strong>V</strong> - Change Vehicle</p>
            <p><strong>Mouse</strong> - Look Around</p>
            <p><strong>SHIFT</strong> - Sprint</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
    <script src="world.js"></script>
    <script src="terrain.js"></script>
    <script src="vehicles.js"></script>
    <script src="player.js"></script>
</body>
</html>
